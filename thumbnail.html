<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Thumbnail Creator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a2e;
            font-family: 'Arial Black', 'Impact', sans-serif;
        }
        
        .thumbnail-container {
            width: 1280px;
            height: 720px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: 8px solid #00ff88;
            box-shadow: 0 0 60px rgba(0, 255, 136, 0.5), 
                        0 0 100px rgba(255, 0, 128, 0.3),
                        inset 0 0 100px rgba(0,0,0,0.3);
        }
        
        .image-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 4px;
        }
        
        .image-cell {
            position: relative;
            overflow: hidden;
            background: #000;
        }
        
        .image-cell img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(1.2) contrast(1.3) saturate(1.4);
        }
        
        .image-cell::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, rgba(255,0,128,0.2), rgba(0,255,136,0.2));
            pointer-events: none;
        }
        
        /* Diagonal split effect */
        .image-cell:nth-child(1) {
            clip-path: polygon(0 0, 100% 0, 100% 90%, 50% 100%, 0 100%);
        }
        
        .image-cell:nth-child(2) {
            clip-path: polygon(50% 0, 100% 0, 100% 100%, 0 100%, 0 90%);
        }
        
        .image-cell:nth-child(3) {
            clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 100%, 0 90%);
        }
        
        .image-cell:nth-child(4) {
            clip-path: polygon(50% 10%, 100% 0, 100% 100%, 0 100%, 0 100%);
        }
        
        /* Main overlay */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        /* Glowing border effect */
        .glow-border {
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            border: 6px solid transparent;
            background: linear-gradient(45deg, #00ff88, #ff0080, #00ff88) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: borderPulse 2s ease-in-out infinite;
        }
        
        @keyframes borderPulse {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.5); }
        }
        
        /* Big text overlay */
        .main-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-5deg);
            text-align: center;
            z-index: 10;
        }
        
        .main-text h1 {
            font-size: 85px;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            text-shadow: 
                -5px -5px 0 #00ff88,
                5px -5px 0 #00ff88,
                -5px 5px 0 #00ff88,
                5px 5px 0 #00ff88,
                0 0 30px #00ff88,
                0 0 60px #00ff88,
                0 0 90px #ff0080;
            letter-spacing: 5px;
            animation: textGlow 1.5s ease-in-out infinite alternate;
            line-height: 1;
        }
        
        .main-text h2 {
            font-size: 50px;
            color: #ffdd00;
            text-shadow: 
                3px 3px 0 #ff0080,
                -3px -3px 0 #00ff88,
                0 0 20px #ffdd00;
            margin-top: 10px;
        }
        
        @keyframes textGlow {
            from { text-shadow: -5px -5px 0 #00ff88, 5px -5px 0 #00ff88, -5px 5px 0 #00ff88, 5px 5px 0 #00ff88, 0 0 30px #00ff88; }
            to { text-shadow: -5px -5px 0 #ff0080, 5px -5px 0 #ff0080, -5px 5px 0 #ff0080, 5px 5px 0 #ff0080, 0 0 50px #ff0080; }
        }
        
        /* Arrow pointing to rare pet */
        .arrow {
            position: absolute;
            font-size: 120px;
            color: #ff0080;
            text-shadow: 0 0 20px #ff0080;
            transform: rotate(15deg);
            animation: bounce 0.5s ease-in-out infinite;
            filter: drop-shadow(0 0 15px #ff0080);
        }
        
        .arrow-top-right {
            top: 15%;
            right: 8%;
        }
        
        @keyframes bounce {
            0%, 100% { transform: rotate(15deg) scale(1); }
            50% { transform: rotate(15deg) scale(1.2); }
        }
        
        /* Value badge */
        .value-badge {
            position: absolute;
            bottom: 25%;
            left: 8%;
            background: linear-gradient(135deg, #ff0080, #ff6b35);
            padding: 15px 30px;
            border-radius: 20px;
            border: 4px solid #fff;
            box-shadow: 0 0 30px rgba(255, 0, 128, 0.8);
            transform: rotate(-8deg);
            animation: badgePulse 1s ease-in-out infinite;
        }
        
        .value-badge span {
            font-size: 42px;
            color: #fff;
            font-weight: 900;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        @keyframes badgePulse {
            0%, 100% { transform: rotate(-8deg) scale(1); }
            50% { transform: rotate(-8deg) scale(1.05); }
        }
        
        /* Question mark effect */
        .question-marks {
            position: absolute;
            font-size: 100px;
            color: #ffdd00;
            text-shadow: 
                3px 3px 0 #ff0080,
                0 0 30px #ffdd00;
            animation: spin 3s linear infinite;
        }
        
        .qm-1 { top: 10%; left: 5%; }
        .qm-2 { top: 15%; right: 5%; animation-delay: 0.5s; }
        .qm-3 { bottom: 10%; left: 15%; animation-delay: 1s; }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        /* Explosion effect */
        .explosion {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255,221,0,0.9) 0%, rgba(255,0,128,0.6) 50%, transparent 70%);
            border-radius: 50%;
            animation: explode 1s ease-out infinite;
            z-index: 5;
        }
        
        @keyframes explode {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
        }
        
        /* Pet labels */
        .pet-label {
            position: absolute;
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 8px 15px;
            border-radius: 10px;
            font-size: 22px;
            font-weight: bold;
            border: 3px solid #00ff88;
        }
        
        .pet-label-1 { bottom: 15%; left: 5%; }
        .pet-label-2 { top: 15%; right: 5%; border-color: #ff0080; }
        .pet-label-3 { bottom: 15%; right: 5%; border-color: #ffdd00; }
    </style>
</head>
<body>
    <div class="thumbnail-container">
        <div class="glow-border"></div>
        
        <div class="image-grid">
            <div class="image-cell">
                <img src="image1.png" alt="Boss Fight">
            </div>
            <div class="image-cell">
                <img src="image2.png" alt="Monster">
            </div>
            <div class="image-cell">
                <img src="image3.png" alt="Phoenix">
            </div>
            <div class="image-cell">
                <img src="image4.png" alt="Eternal Oni Tiger">
            </div>
        </div>
        
        <div class="explosion"></div>
        
        <div class="main-text">
            <h1>I FOUND IT!</h1>
            <h2>$2 BILLION PET</h2>
        </div>
        
        <span class="arrow arrow-top-right">⬇️</span>
        
        <div class="value-badge">
            <span>💎 $2.1 BILLION</span>
        </div>
        
        <span class="question-marks qm-1">❓</span>
        <span class="question-marks qm-2">❓</span>
        <span class="question-marks qm-3">❓</span>
        
        <div class="pet-label pet-label-1">🔥 MEGA PHOENIX</div>
        <div class="pet-label pet-label-2">👹 BOSS FIGHT</div>
        <div class="pet-label pet-label-3">💀 $314M/s</div>
    </div>
</body>
</html>
